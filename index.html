<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Datasette</title>
<style>
html, body {
  margin: 0;
  height: 100%;
  font-family: Helvetica, Arial, sans-serif;
}
#loading-indicator {
  text-align: center;
}
#loading-indicator svg {
  height: 20vh;
}
#loading-indicator textarea {
  height: 40vh;
  width: 90%;
  padding: 1em;
  background-color: #276890;
  color: white;
  border: 1px solid black;
  overflow: auto;
  outline: none;
  resize: none;
  opacity: 0.6;
  font-size: min(3vw, 1.2em);
  line-height: 1.8;
}
/* Datasette itself runs in this iframe, served by the service worker */
#datasette {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
body.ready #datasette {
  display: block;
}
body.ready #loading-indicator {
  display: none;
}
</style>
<script defer data-domain="lite.datasette.io" src="https://plausible.io/js/script.manual.js"></script>
<script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>
</head>
<body>

<div id="loading-indicator">
