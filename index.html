<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Datasette</title>
<style>
html, body {
  margin: 0;
  height: 100%;
}
/* The loading screen borrows Datasette's own colours, fonts and header, so
   the page that replaces it looks like the same page filling in */
body {
  font-family: "Helvetica Neue", sans-serif;
  font-size: 1rem;
  line-height: 1.5;
  color: #111A35;
  background-color: #F8FAFB;
  -webkit-text-size-adjust: 100%;
}
#shell-header {
  box-sizing: border-box;
  min-height: 2.6rem;
  padding: 0.6rem 1rem 0.5rem 1rem;
  background: #276890 linear-gradient(180deg, rgba(96,144,173,1) 0%, rgba(39,104,144,1) 50%);
  color: rgba(255,255,244,0.9);
}
#shell-content {
  max-width: 44rem;
  /* Bottom padding leaves room for #shell-footer, which wraps onto three
     rows on the narrowest phones, so it never covers the end of the page */
  padding: 0 1rem 9rem 1rem;
}
#shell-content h1 {
  margin: 1rem 0 0.75rem 0;
  font-size: 2rem;
  line-height: 1.2;
}
#loading-logs {
  margin: 0;
  padding: 0;
  list-style: none;
  max-height: 50vh;
  overflow-y: auto;
  font-size: 0.9rem;
}
#loading-logs li {
  position: relative;
  padding: 0.15rem 0 0.15rem 1.6rem;
  color: #5c6b7a;
  /* URLs of the files being downloaded can be very long */
  overflow-wrap: anywhere;
}
/* Finished steps get a tick, the step in progress a spinner */
#loading-logs li::before {
  content: "";
  position: absolute;
  left: 0.2rem;
  top: 0.45rem;
  width: 0.35rem;
  height: 0.65rem;
  border: solid #54AC8E;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
#loading-logs li:last-child {
  color: #111A35;
  font-weight: 600;
}
#loading-logs li:last-child::before {
  left: 0;
  top: 0.4rem;
  width: 0.7rem;
  height: 0.7rem;
  border: 2px solid #c5d6e2;
  border-top-color: #276890;
  border-radius: 50%;
  transform: none;
  animation: shell-spin 0.8s linear infinite;
}
@keyframes shell-spin {
  to { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
  #loading-logs li:last-child::before {
    animation-duration: 4s;
  }
}
#loading-note {
  margin: 1.25rem 0 0 0;
  font-size: 0.85rem;
  color: #5c6b7a;
}
#output .error {
  margin-top: 1rem;
  padding: 1rem;
  background-color: rgba(208,2,27,0.3);
}
#output .error h2 {
  margin: 0 0 0.5rem 0;
  font-size: 1.25rem;
}
#output .error p {
  margin: 0;
  overflow-wrap: anywhere;
}
#output .error details {
  margin-top: 0.75rem;
  font-size: 0.85rem;
}
#output .error summary {
  cursor: pointer;
}
#output .error pre {
  margin: 0.5rem 0 0 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
/* The "Load CSV" etc buttons (see shell.js), pinned to the bottom of the
   window so they can be used while Datasette is still starting up */
#shell-footer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  border-top: 1px solid #e3ebf1;
  background-color: #F8FAFB;
}
/* Datasette's link colours */
#shell-footer a:link {
  color: #276890;
}
#shell-footer a:visited {
  color: #54AC8E;
}
/* Datasette itself runs in this iframe, served by the service worker */
#datasette {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
body.ready #datasette {
  display: block;
}
body.ready #shell-header,
body.ready #shell-footer,
body.ready #loading-indicator {
  display: none;
}
</style>
<script defer data-domain="lite.datasette.io" src="https://plausible.io/js/script.manual.js"></script>
<script>window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) }</script>
</head>
<body>

<header id="shell-header">Datasette Lite</header>

<main id="shell-content">
  <div id="loading-indicator">
    <h1>Loading Datasette</h1>
    <ol id="loading-logs" role="log" aria-label="Startup progress"><li>Loading Python (Pyodide)...</li></ol>
    <p id="loading-note">Datasette is starting up inside your browser, using Python compiled to WebAssembly. The first visit takes longest - after that most of it comes from your browser's cache.</p>
  </div>
  <div id="output"></div>
</main>

<footer id="shell-footer"></footer>

<iframe id="datasette" title="Datasette"></iframe>

<script src="shell.js"></script>
</body>
</html>
